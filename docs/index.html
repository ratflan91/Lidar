<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Depth Mapper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #overlay {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud { position: fixed; inset: 0; pointer-events: none; }

    #depth-label {
      position: absolute;
      top: max(20px, env(safe-area-inset-top, 20px));
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 18px; font-weight: 600;
      padding: 10px 22px; border-radius: 14px;
      white-space: nowrap;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
    }

    #legend-wrap {
      position: absolute; right: 14px;
      top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 6px;
    }
    #legend-labels {
      display: flex; flex-direction: column;
      justify-content: space-between;
      height: 130px; align-items: flex-end;
    }
    .leg-lbl {
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,.85);
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    #legend-bar {
      width: 14px; height: 130px; border-radius: 7px;
      background: linear-gradient(to bottom,
        rgb(20,75,235), rgb(25,200,70),
        rgb(245,245,20), rgb(255,140,0), rgb(230,30,25));
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }

    #controls {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; pointer-events: all;
    }
    button {
      background: rgba(0,0,0,.7); color: #fff; border: none;
      border-radius: 14px; padding: 13px 18px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      min-width: 120px; text-align: center;
    }
    button:active { opacity: .65; }
    #freeze-btn.frozen { background: rgba(210,35,35,.85); }

    #perf {
      position: absolute;
      bottom: max(88px, calc(env(safe-area-inset-bottom, 24px) + 64px));
      left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,.4);
      white-space: nowrap;
    }

    #loader {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; z-index: 10;
    }
    #loader.hidden { display: none; }
    #loader-text {
      color: #fff; font-size: 16px; font-weight: 500;
      text-align: center; padding: 0 32px; line-height: 1.6;
      max-width: 320px;
    }
    #loader-bar-wrap {
      width: 220px; height: 4px;
      background: rgba(255,255,255,.15); border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%; width: 0%;
      background: #4090ff; border-radius: 2px;
      transition: width .3s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<video id="video" playsinline autoplay muted></video>
<canvas id="overlay"></canvas>

<div id="hud">
  <div id="depth-label">Starting…</div>

  <svg id="crosshair" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <filter id="sh"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="rgba(0,0,0,.9)"/></filter>
    <g filter="url(#sh)" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <line x1="2" y1="22" x2="13" y2="22"/><line x1="31" y1="22" x2="42" y2="22"/>
      <line x1="22" y1="2" x2="22" y2="13"/><line x1="22" y1="31" x2="22" y2="42"/>
    </g>
    <circle cx="22" cy="22" r="2.5" fill="white" filter="url(#sh)"/>
  </svg>

  <div id="legend-wrap">
    <div id="legend-labels">
      <span class="leg-lbl">Far</span>
      <span class="leg-lbl">Near</span>
    </div>
    <div id="legend-bar"></div>
  </div>

  <div id="controls">
    <button id="mode-btn">🎨 Gradient</button>
    <button id="freeze-btn">⏸ Freeze</button>
  </div>

  <div id="perf"></div>
</div>

<div id="loader">
  <div class="spinner"></div>
  <div id="loader-text">Starting camera…</div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<script type="module">
import { pipeline, env }
  from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.esm.min.js';

// Always fetch model weights from CDN (no local cache on first visit)
env.allowLocalModels = false;

// ── Config ────────────────────────────────────────────────────────────────
const MODEL_ID   = 'Xenova/depth-anything-small-hf';
const INPUT_SIZE = 518;   // DepthAnything preferred input size
const LOOP_MS    = 120;   // ~8 fps depth updates

const MODES      = ['Gradient', 'Contour', 'Combined', 'Camera'];
const MODE_ICONS = ['🎨', '〰️', '🗺️', '📷'];

// Color ramp: t=0 → near (red), t=1 → far (blue)
const STOPS = [
  [230,  30,  25],
  [255, 140,   0],
  [245, 245,  20],
  [ 25, 200,  70],
  [ 20,  75, 235],
];

// ── State ─────────────────────────────────────────────────────────────────
let mode    = 0;
let frozen  = false;
let pipe    = null;

// ── DOM ───────────────────────────────────────────────────────────────────
const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const octx       = overlay.getContext('2d');
const depthLbl   = document.getElementById('depth-label');
const loaderEl   = document.getElementById('loader');
const loaderText = document.getElementById('loader-text');
const loaderBar  = document.getElementById('loader-bar');
const modeBtn    = document.getElementById('mode-btn');
const freezeBtn  = document.getElementById('freeze-btn');
const perfEl     = document.getElementById('perf');
const legendWrap = document.getElementById('legend-wrap');

// ── Helpers ───────────────────────────────────────────────────────────────
function setLoader(text, pct = null) {
  if (text === null) { loaderEl.classList.add('hidden'); return; }
  loaderEl.classList.remove('hidden');
  loaderText.textContent = text;
  if (pct !== null) loaderBar.style.width = pct + '%';
}

function depthToRGB(t) {
  t = Math.max(0, Math.min(1, t));
  const s = t * (STOPS.length - 1);
  const i = Math.min(s | 0, STOPS.length - 2);
  const f = s - i;
  const a = STOPS[i], b = STOPS[i + 1];
  return [
    (a[0] + f * (b[0] - a[0]) + .5) | 0,
    (a[1] + f * (b[1] - a[1]) + .5) | 0,
    (a[2] + f * (b[2] - a[2]) + .5) | 0,
  ];
}

// ── Camera ────────────────────────────────────────────────────────────────
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' },
             width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise((ok, fail) => {
    video.onloadedmetadata = ok;
    video.onerror = fail;
  });
  syncSize();
}

function syncSize() {
  overlay.width  = window.innerWidth;
  overlay.height = window.innerHeight;
}
window.addEventListener('resize', syncSize);

// ── Snapshot helper (center-crop video → square canvas) ───────────────────
const snap    = document.createElement('canvas');
snap.width    = INPUT_SIZE;
snap.height   = INPUT_SIZE;
const snapCtx = snap.getContext('2d');

function captureFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s  = Math.min(vw, vh);
  snapCtx.drawImage(video, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, INPUT_SIZE, INPUT_SIZE);
  return snap;
}

// ── Rendering ─────────────────────────────────────────────────────────────
let renderCanvas = null, rctx = null;

function paintDepth(rawData, dw, dh) {
  // Normalize raw depth values to [0, 1]
  // DepthAnything outputs inverse depth: larger value = CLOSER.
  // We invert so t=0 means near (red) and t=1 means far (blue).
  let min = rawData[0], max = rawData[0];
  for (let i = 1; i < rawData.length; i++) {
    if (rawData[i] < min) min = rawData[i];
    if (rawData[i] > max) max = rawData[i];
  }
  const range = (max - min) || 1;

  if (!renderCanvas || renderCanvas.width !== dw) {
    renderCanvas = document.createElement('canvas');
    renderCanvas.width = dw; renderCanvas.height = dh;
    rctx = renderCanvas.getContext('2d');
  }

  const img = rctx.createImageData(dw, dh);
  const px  = img.data;
  const BAND = 0.08;

  // Center pixel index for depth readout
  const ci = ((dh / 2 | 0) * dw + (dw / 2 | 0));
  // Invert: DepthAnything high = close → t=0 (red) = near
  const centerT = 1 - (rawData[ci] - min) / range;
  updateLabel(centerT);

  for (let i = 0; i < dw * dh; i++) {
    const t = 1 - (rawData[i] - min) / range;  // 0=near, 1=far
    let r = 0, g = 0, b = 0, a = 0;

    if (mode !== 3) {
      const frac = (t / BAND) % 1;
      const edge = frac < 0.1 || frac > 0.9;
      const [cr, cg, cb] = depthToRGB(t);

      if      (mode === 0) { r=cr; g=cg; b=cb; a=172; }
      else if (mode === 1) {
        if (edge) { r=0; g=0; b=0; a=225; }
        else      { r=cr; g=cg; b=cb; a=50; }
      } else {
        if (edge) { r=0; g=0; b=0; a=225; }
        else      { r=cr; g=cg; b=cb; a=165; }
      }
    }

    const p = i * 4;
    px[p]=r; px[p+1]=g; px[p+2]=b; px[p+3]=a;
  }

  rctx.putImageData(img, 0, 0);
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.drawImage(renderCanvas, 0, 0, overlay.width, overlay.height);
}

// ── Depth label ───────────────────────────────────────────────────────────
const BANDS = [
  [.20, '● Very Close', '#ff4040'],
  [.40, '● Close',      '#ff8800'],
  [.60, '● Mid Range',  '#e8e820'],
  [.80, '● Far',        '#20cc50'],
  [1.1, '● Very Far',   '#4090ff'],
];
function updateLabel(t) {
  for (const [thresh, text, color] of BANDS) {
    if (t < thresh) { depthLbl.textContent = text; depthLbl.style.color = color; return; }
  }
}

// ── Inference loop ────────────────────────────────────────────────────────
async function inferenceLoop() {
  while (true) {
    await new Promise(r => setTimeout(r, LOOP_MS));
    if (frozen || !pipe || video.readyState < 2) continue;

    try {
      const t0 = performance.now();

      const frame  = captureFrame();
      const result = await pipe(frame);

      // predicted_depth dims: [H, W] or [1, H, W]
      const tensor = result.predicted_depth;
      const dims   = tensor.dims;
      const dh     = dims[dims.length - 2];
      const dw     = dims[dims.length - 1];
      const data   = tensor.data;  // Float32Array

      paintDepth(data, dw, dh);

      perfEl.textContent = `${(performance.now() - t0) | 0} ms / frame`;
    } catch (e) {
      console.warn('Depth error:', e);
    }
  }
}

// ── UI ────────────────────────────────────────────────────────────────────
modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % MODES.length;
  modeBtn.textContent = `${MODE_ICONS[mode]} ${MODES[mode]}`;
  legendWrap.style.visibility = mode !== 3 ? 'visible' : 'hidden';
  if (mode === 3) octx.clearRect(0, 0, overlay.width, overlay.height);
});

freezeBtn.addEventListener('click', () => {
  frozen = !frozen;
  freezeBtn.textContent = frozen ? '▶ Unfreeze' : '⏸ Freeze';
  freezeBtn.classList.toggle('frozen', frozen);
});

// ── Boot ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    setLoader('Starting camera…', 0);
    await startCamera();

    setLoader('Downloading depth model…\nFirst load ~30 s on mobile', 10);

    pipe = await pipeline('depth-estimation', MODEL_ID, {
      progress_callback: ({ status, loaded, total }) => {
        if (status === 'progress' && total > 0) {
          setLoader(
            `Downloading model…\n${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`,
            10 + (loaded / total) * 88
          );
        }
      },
    });

    setLoader(null);
    depthLbl.textContent = 'Scanning…';
    depthLbl.style.color = '#fff';

    inferenceLoop();
  } catch (err) {
    setLoader(`⚠️ ${err.message || 'Setup failed'}\n\nOpen this page over HTTPS and allow camera access.`);
    console.error(err);
  }
})();
</script>
</body>
</html>
